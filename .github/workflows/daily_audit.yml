name: 台股 AI 核心板塊每日稽核管線

on:
  schedule:
    # 台灣時間 (UTC+8) 早上 07:30 執行 -> 對應 UTC 時間 23:30 (週日至週四執行，對應台灣週一至週五)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # 保留手動點擊觸發按鈕

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 配置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝解析與爬蟲相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml html5lib beautifulsoup4

      - name: 執行現金流稽核引擎
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          python audit_engine.py
